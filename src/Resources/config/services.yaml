services:
  _defaults:
    autowire:       true
    autoconfigure:  true
    public:         true

##### Services #####
  _instanceof:
    Austral\EntityBundle\Sanitizer\AustralSanitizerInterface:
      tags: [ 'austral_entity.sanitizer_rule' ]

  Austral\EntityBundle\Sanitizer\AustralDefaultSanitizer: ~
  Austral\EntityBundle\Sanitizer\AustralHtmlSanitizer: ~

  Austral\EntityBundle\Services\Sanitizer: ~
  austral.entity.sanitizer:
    alias:        Austral\EntityBundle\Services\Sanitizer
    public:       true

  Austral\EntityBundle\Services\InitialiseBundleEntities: ~
  austral.entity.initialise-bundle:
    alias:        Austral\EntityBundle\Services\InitialiseBundleEntities
    public:       true

  Austral\EntityBundle\EntityAttributes\EntitiesAttributes: ~
  austral.entity.entities-attributes:
    alias:        Austral\EntityBundle\EntityAttributes\EntitiesAttributes
    public:       true

  Austral\EntityBundle\Mapping\Mapping: ~
  austral.entity.mapping:
    alias:        Austral\EntityBundle\Mapping\Mapping
    public:       true

##### Austral Event Subscriber

  Austral\EntityBundle\EventSubscriber\EntityManagerEventSubscriber:
    tags:
      - { name: kernel.event_subscriber }
  austral.entity.manager.event_subscriber:
    alias:        Austral\EntityBundle\EventSubscriber\EntityManagerEventSubscriber
    public:       true

  Austral\EntityBundle\EventSubscriber\EntityMappingEventSubscriber:
    tags:
      - { name: kernel.event_subscriber }
  austral.entity.mapping.event_subscriber:
    alias:        Austral\EntityBundle\EventSubscriber\EntityMappingEventSubscriber
    public:       true

  Austral\EntityBundle\EventSubscriber\QueryBuilderEventSubscriber:
    tags:
      - { name: kernel.event_subscriber }
  austral.entity.query_builder.event_subscriber:
    alias:        Austral\EntityBundle\EventSubscriber\QueryBuilderEventSubscriber
    public:       true

##### Austral Entity Manager
  Austral\EntityBundle\EntityManager\EntityManager: ~
  austral.entity_manager:
    alias:        Austral\EntityBundle\EntityManager\EntityManager
    public:       true

##### Annotation Listener Kernel
  Austral\EntityBundle\Listener\EntityMappingListener:
    tags:
      - { name: kernel.event_listener, event: kernel.request, method: initEntityAnnotations, priority: 0 }
  austral.entity.mapping.listener:
    alias:        Austral\EntityBundle\Listener\EntityMappingListener
    public:       true

##### Doctrine Listener (nettoyage #[AustralEntitySanitize])
  Austral\EntityBundle\Listener\DoctrineListener:
    tags:
      - { name: doctrine.event_listener, event: prePersist, connection: default }
      - { name: doctrine.event_listener, event: preUpdate, connection: default }
  austral.entity.doctrine.listener:
    alias:        Austral\EntityBundle\Listener\DoctrineListener
    public:       true
